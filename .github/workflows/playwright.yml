name: Playwright Tests – Scholarship System

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  playwright-tests:
    name: Run Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore
        working-directory: ./Server

      - name: Build backend
        run: dotnet build --no-restore
        working-directory: ./Server

      - name: Start backend (ASP.NET Core – HTTPS port 7255)
        run: dotnet run --no-build &
        working-directory: ./Server
        env:
          ASPNETCORE_URLS: https://localhost:7255
          ASPNETCORE_ENVIRONMENT: Development
          DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP3SUPPORT: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./Client

      - name: Start frontend (dev mode)
        run: npm run dev -- --port 3000 &
        working-directory: ./Client

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: ./Client

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend on https://localhost:7255..."
          for i in {1..30}; do
            curl -sk https://localhost:7255/api/scholarship && echo "Backend ready!" && break
            echo "Attempt $i - waiting..."
            sleep 2
          done

      - name: Start frontend preview (port 3000)
        run: npm run preview -- --port 3000 &
        working-directory: ./Client

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend on https://localhost:3000..."
          for i in {1..15}; do
            curl -s https://localhost:3000 && echo "Frontend ready!" && break
            sleep 2
          done

      - name: Run Playwright tests
        run: npx playwright test --reporter=html
        working-directory: ./Client
        env:
          CI: true

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: Client/playwright-report/
          retention-days: 30

      - name: Upload failed test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ github.run_number }}
          path: Client/test-results/
          retention-days: 7
